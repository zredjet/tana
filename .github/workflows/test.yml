name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 取り消すのは、同じ PR に新しい push があった場合の古い実行だけ。push の実行はすべてのコミットで最後まで実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # VHD の作成と FSOPS_CROSSVOL_DIR・FSOPS_TEST_TRASH の設定はフェーズ2で追加する（SPEC §19）。
      - run: go vet ./...
      - run: go test ./...

  macos:
    # 非公開リポジトリでは、macOS のジョブは pull_request と workflow_dispatch のときだけ実行する（SPEC §19）。
    if: ${{ !github.event.repository.private || github.event_name != 'push' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # hdiutil によるイメージの作成と FSOPS_CROSSVOL_DIR・FSOPS_TEST_TRASH の設定はフェーズ2で追加する（SPEC §19）。
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go vet ./...

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      # ごみ箱が使えないことを確かめるテストはフェーズ10で追加する（SPEC §19）。
