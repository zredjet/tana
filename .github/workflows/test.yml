name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 取り消すのは、同じ PR に新しい push があった場合の古い実行だけ。push の実行はすべてのコミットで最後まで実行する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ボリュームをまたぐテスト用に、64 MB の VHD を NTFS で作って T: に割り当てる（SPEC §19、V7）。
      - name: Create cross-volume VHD
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "fsopstest.vhd"
          $script = Join-Path $env:RUNNER_TEMP "diskpart.txt"
          @(
            "create vdisk file=`"$vhd`" maximum=64 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick label=fsopstest",
            "assign letter=T"
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed: $LASTEXITCODE" }
          Get-Volume -DriveLetter T | Format-List
          "FSOPS_CROSSVOL_DIR=T:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FSOPS_TEST_TRASH=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: go vet ./...
      - run: go test ./...
      # 要検証事項のプローブは、結果をログに残すため -v で実行する（SPEC §20）。
      - name: Probes (verbose)
        run: go test -count=1 -v ./internal/fsops/internal/probe/

  macos:
    # 非公開リポジトリでは、macOS のジョブは pull_request と workflow_dispatch のときだけ実行する（SPEC §19）。
    if: ${{ !github.event.repository.private || github.event_name != 'push' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ボリュームをまたぐテスト用に、64 MB の APFS イメージを作ってマウントする（SPEC §18.3、§19、V7）。
      - name: Create cross-volume disk image
        run: |
          hdiutil create -size 64m -fs APFS -volname fsopstest "$RUNNER_TEMP/fsopstest.dmg"
          hdiutil attach "$RUNNER_TEMP/fsopstest.dmg"
          echo "FSOPS_CROSSVOL_DIR=/Volumes/fsopstest" >> "$GITHUB_ENV"
          echo "FSOPS_TEST_TRASH=1" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...
      # 要検証事項のプローブは、結果をログに残すため -v で実行する（SPEC §20）。
      - name: Probes (verbose)
        run: go test -count=1 -v ./internal/fsops/internal/probe/
      - run: CGO_ENABLED=0 go vet ./...

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      # ごみ箱が使えないことを確かめるテストはフェーズ10で追加する（SPEC §19）。
